<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al POA 2026</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #3E6257; /* Nuevo color verde institucional */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .login-card { 
            background: white; 
            padding: 50px 40px; /* Un poco más de espacio interior */
            border-radius: 12px; /* Bordes un poco más suaves */
            width: 100%; 
            max-width: 350px; /* Tarjeta un poco más ancha para las letras grandes */
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
        }
        
        /* Contenedor del Logo */
        .logo-container img { 
            max-width: 110px; 
            height: auto; 
            margin-bottom: 15px; 
        }

        h2 { 
            color: #2c3e50; 
            margin-top: 0; 
            margin-bottom: 25px; 
            font-size: 26px; /* Letra más grande */
            font-weight: bold;
        }

        input { 
            width: 100%; 
            padding: 14px; /* Inputs más altos */
            margin: 10px 0 15px 0; 
            border: 1px solid #bdc3c7; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; /* Letra más grande */
            background-color: #f9f9f9;
            color: #333;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
            background-color: #fff;
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #e74c3c; /* Rojo similar a la imagen */
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 18px; /* Letra más grande */
            font-weight: bold; 
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #c0392b;
        }

        button:disabled {
            background-color: #e8a29c;
            cursor: not-allowed;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="login-card">

        <div class="logo-container">
            <img src="logo.jpeg" alt="Logo Sistema POA">
        </div>

        <h2>Sistema POA</h2>

        <form id="loginForm">
            <label for="email" class="sr-only">Correo Institucional</label>
            <input type="email" id="email" placeholder="Correo Institucional" value="trejorafa_7@yahoo.com.mx" autocomplete="email">

            <label for="password" class="sr-only">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña" value="RafatrejoPoa2026.." autocomplete="current-password">

            <button type="submit" id="btnIngresar">Ingresar</button>
        </form>

        <p id="errorMsg" style="color: #c0392b; font-weight: bold; display: none; margin-top: 15px;">Datos incorrectos</p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (evento) {
            evento.preventDefault();
            iniciarSesion();
        });

        async function iniciarSesion() {
            // 1. Obtener datos
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            const errorMsg = document.getElementById('errorMsg');
            const boton = document.getElementById('btnIngresar');

            // Limpiamos mensajes previos
            errorMsg.style.display = 'none';

            if (!emailInput.value || !passInput.value) {
                errorMsg.innerText = "⚠️ Por favor escribe correo y contraseña";
                errorMsg.style.display = 'block';
                return;
            }

            boton.disabled = true;
            boton.innerText = 'Ingresando...';

            try {
                console.log("Intentando conectar con el servidor...");

                // 2. Intentar conectar (AJUSTADO PARA INTERNET)
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value, password: passInput.value })
                });

                // 3. Verificar si el servidor contestó con un error real (no 401 de credenciales)
                if (!resp.ok && resp.status !== 401) {
                    throw new Error(`Error del servidor: ${resp.status}`);
                }

                const data = await resp.json();

                if (data.exito) {
                    // ¡Login exitoso! Guardamos usuario
                    localStorage.setItem('usuarioPOA', JSON.stringify(data.usuario));
                  // REDIRECCIÓN INTELIGENTE
                    if (data.usuario.rol === 'SUPERADMIN') {
                        window.location.href = 'superadmin.html'; // Tú vas a tu panel de control total
                    } else if (data.usuario.rol === 'ADMIN') {
                        window.location.href = 'presidencia.html'; // El Jefe va a la gráfica general
                    } else {
                        window.location.href = 'captura.html'; // El trabajador va directo a trabajar
                    }
                    return;
                } else {
                    // Login fallido (contraseña mal)
                    errorMsg.innerText = "❌ " + (data.mensaje || "Datos incorrectos");
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                console.error(error);
                errorMsg.innerText = "🚨 ERROR DE CONEXIÓN: No se pudo contactar al servidor. Inténtalo de nuevo más tarde.";
                errorMsg.style.display = 'block';
            } finally {
                boton.disabled = false;
                boton.innerText = 'Ingresar';
            }
        }
    </script>
</body>
</html>
